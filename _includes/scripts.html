<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    var icon = btn.querySelector('i');
    function sync() {
      var dark = root.getAttribute('data-theme') === 'dark';
      icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
      var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
    btn.addEventListener('click', function () {
      var dark = root.getAttribute('data-theme') === 'dark';
      if (dark) {
        root.removeAttribute('data-theme');
      } else {
        root.setAttribute('data-theme', 'dark');
      }
      try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>

<script>
  /* Greeting animation on the homepage: play once per browser session, then
     show the HTML end card. Comments stay in this form because the production
     build compresses HTML and would break line comments. */
  (function () {
    var root = document.querySelector('.greeting');
    if (!root) return;
    var video = root.querySelector('.greeting__video');
    var card = root.querySelector('.greeting__end');
    var replay = root.querySelector('.greeting__replay');
    if (!video || !card || !replay) return;
    function showCard(fade) {
      card.hidden = false;
      if (fade) {
        /* A forced reflow makes the card start at opacity 0, so the class change below runs the fade. */
        void card.offsetWidth;
      }
      root.classList.add('greeting--ended');
    }
    function hideCard() {
      root.classList.remove('greeting--ended');
      card.hidden = true;
    }
    function start() {
      var promise;
      try { promise = video.play(); } catch (e) { showCard(false); return; }
      if (promise && typeof promise.then === 'function') {
        promise.then(null, function () { showCard(false); });
      }
    }

    video.addEventListener('ended', function () { showCard(true); });
    replay.addEventListener('click', function () {
      hideCard();
      try { video.currentTime = 0; } catch (e) {}
      start();
    });

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      showCard(false);
    } else {
      start();
    }
  })();
</script>
